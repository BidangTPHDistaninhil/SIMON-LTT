<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengaturan · SIMON-LTT INHIL</title>
<link rel="stylesheet" href="assets/css/app.css?v=2.1">
<script src="assets/js/config.js?v=2.1"></script>
<script src="assets/js/simon-ui.js?v=2.1"></script>
<script src="assets/js/simon-libs.js?v=2.1"></script>
<script src="assets/js/simon-api.js?v=2.1"></script>
<script src="assets/js/shell.js?v=2.1"></script>
<style>
/* Tombol lihat/sembunyikan password — khusus halaman Pengaturan */
.pw-field{position:relative;}
.pw-field input{width:100%;padding-right:46px;}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border:0;background:transparent;color:#64748b;cursor:pointer;border-radius:6px;}
.pw-toggle:hover{color:#0f766e;background:rgba(15,118,110,.08);}
.pw-toggle:focus-visible{outline:2px solid #0f766e;outline-offset:2px;}
.pw-toggle svg{width:19px;height:19px;display:block;}
</style>
</head>
<body data-mode="app" data-page="pengaturan" data-title="Pengaturan" data-roles="">
<div class="layout">
<aside class="sidebar" id="sidebar"></aside>
<div class="content">
<header class="topbar" id="topbar"></header>
<main>
<div id="warnGanti"></div>
<div class="grid g2">
<div class="card"><h2><span class="bar"></span>Profil</h2><div id="profil"></div></div>
<div class="card"><h2><span class="bar"></span>Ganti Password</h2>
<label for="pOld">Password lama</label>
<div class="pw-field">
  <input type="password" id="pOld" autocomplete="current-password">
  <button type="button" class="pw-toggle" data-password-target="pOld" aria-label="Lihat password lama" title="Lihat password" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</div>
<label for="pNew">Password baru (minimal 8 karakter)</label>
<div class="pw-field">
  <input type="password" id="pNew" autocomplete="new-password">
  <button type="button" class="pw-toggle" data-password-target="pNew" aria-label="Lihat password baru" title="Lihat password" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</div>
<label for="pNew2">Ulangi password baru</label>
<div class="pw-field">
  <input type="password" id="pNew2" autocomplete="new-password">
  <button type="button" class="pw-toggle" data-password-target="pNew2" aria-label="Lihat ulangi password baru" title="Lihat password" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</div>
<div style="margin-top:14px"><button class="btn" id="btnPw">Simpan Password</button></div></div>
</div>
<script>
SimonShell.ready(function(me){
  var U=SimonUI;

  // Tombol mata untuk menampilkan/menyembunyikan masing-masing password.
  var eyeOpen='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  var eyeClosed='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.1 0 2.1-.2 3-.5"/></svg>';
  document.querySelectorAll('.pw-toggle').forEach(function(btn){
    btn.addEventListener('click',function(){
      var field=document.getElementById(btn.getAttribute('data-password-target'));
      if(!field)return;
      var show=field.type==='password';
      field.type=show?'text':'password';
      btn.innerHTML=show?eyeClosed:eyeOpen;
      btn.setAttribute('aria-pressed',show?'true':'false');
      btn.setAttribute('aria-label',(show?'Sembunyikan ':'Lihat ')+({pOld:'password lama',pNew:'password baru',pNew2:'ulangi password baru'}[field.id]||'password'));
      btn.title=show?'Sembunyikan password':'Lihat password';
    });
  });

  if(new URLSearchParams(location.search).get('ganti')||me.mustChange) document.getElementById('warnGanti').innerHTML='<div class="banner warn">Demi keamanan, Anda wajib mengganti password sementara sebelum memakai aplikasi.</div>';
  document.getElementById('profil').innerHTML='<p><b>'+U.esc(me.nama||'')+'</b></p><p>Username: '+U.esc(me.username)+'</p><p>Peran: '+U.esc(SimonShell.ROLE_LABEL[me.role]||me.role)+'</p>'+(me.kecamatan?'<p>Kecamatan tugas: '+U.esc(me.kecamatan)+'</p>':'');
  document.getElementById('btnPw').onclick=async function(){
    var o=pOld.value,n=pNew.value,n2=pNew2.value;
    if(!o||!n){U.toast('Isi password lama dan baru.',true);return;}
if(n.length<8){U.toast('Password baru minimal 8 karakter.',true);return;}
if(n!==n2){U.toast('Ulangi password baru dengan sama persis.',true);return;}
    U.busy(this,true,'Menyimpan…');
    try{await SimonAPI.call('auth.changePassword',{oldPassword:o,newPassword:n});U.toast('Password berhasil diganti.');setTimeout(function(){location.href=SIMON_CONFIG.HOME_PAGE;},900);}
    catch(e){U.toast(U.errMsg(e),true);U.busy(this,false);}
  };
});
</script>
</main>
</div>
</div>
</body>
</html>
