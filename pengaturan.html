<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengaturan · SIMON-LTT INHIL</title>
<link rel="stylesheet" href="assets/css/app.css?v=2.1">
<script src="assets/js/config.js?v=2.1"></script>
<script src="assets/js/simon-ui.js?v=2.1"></script>
<script src="assets/js/simon-libs.js?v=2.1"></script>
<script src="assets/js/simon-api.js?v=2.1"></script>
<script src="assets/js/shell.js?v=2.1"></script>
</head>
<body data-mode="app" data-page="pengaturan" data-title="Pengaturan" data-roles="">
<div class="layout">
<aside class="sidebar" id="sidebar"></aside>
<div class="content">
<header class="topbar" id="topbar"></header>
<main>
<div id="warnGanti"></div>
<div class="grid g2">
<div class="card"><h2><span class="bar"></span>Profil</h2><div id="profil"></div></div>
<div class="card"><h2><span class="bar"></span>Ganti Password</h2>
<label for="pOld">Password lama</label><input type="password" id="pOld" autocomplete="current-password">
<label for="pNew">Password baru (minimal 8 karakter)</label><input type="password" id="pNew" autocomplete="new-password">
<label for="pNew2">Ulangi password baru</label><input type="password" id="pNew2" autocomplete="new-password">
<div style="margin-top:14px"><button class="btn" id="btnPw">Simpan Password</button></div></div>
</div>
<script>
SimonShell.ready(function(me){
  var U=SimonUI;
  if(new URLSearchParams(location.search).get('ganti')||me.mustChange) document.getElementById('warnGanti').innerHTML='<div class="banner warn">Demi keamanan, Anda wajib mengganti password sementara sebelum memakai aplikasi.</div>';
  document.getElementById('profil').innerHTML='<p><b>'+U.esc(me.nama||'')+'</b></p><p>Username: '+U.esc(me.username)+'</p><p>Peran: '+U.esc(SimonShell.ROLE_LABEL[me.role]||me.role)+'</p>'+(me.kecamatan?'<p>Kecamatan tugas: '+U.esc(me.kecamatan)+'</p>':'');
  document.getElementById('btnPw').onclick=async function(){
    var o=pOld.value,n=pNew.value,n2=pNew2.value;
    if(!o||!n){U.toast('Isi password lama dan baru.',true);return;}
if(n.length<8){U.toast('Password baru minimal 8 karakter.',true);return;}
if(n!==n2){U.toast('Ulangi password baru dengan sama persis.',true);return;}
    U.busy(this,true,'Menyimpan…');
    try{await SimonAPI.call('auth.changePassword',{oldPassword:o,newPassword:n});U.toast('Password berhasil diganti.');setTimeout(function(){location.href=SIMON_CONFIG.HOME_PAGE;},900);}
    catch(e){U.toast(U.errMsg(e),true);U.busy(this,false);}
  };
});
</script>
</main>
</div>
</div>
</body>
</html>
