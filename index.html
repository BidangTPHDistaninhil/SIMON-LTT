<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3b2e">
<title>Login · SIMON-LTT INHIL</title>
<link rel="stylesheet" href="assets/css/app.css?v=2.1">
<script src="assets/js/config.js?v=2.1"></script>
<script src="assets/js/simon-ui.js?v=2.1"></script>
<script src="assets/js/simon-api.js?v=2.1"></script>
<style>
/* ===== SIMON-LTT · Login Premium (hanya tampilan; seluruh gaya khusus halaman ini ada di sini) ===== */
:root{
  --lg-forest:#0b3b2e;--lg-forest-2:#0f4d3b;--lg-emerald:#059669;--lg-emerald-d:#047857;--lg-fresh:#34d399;
  --lg-gold:#c9a227;--lg-gold-soft:#f0d98a;--lg-warm:#fffcf4;--lg-ink:#12241a;--lg-muted:#5b6f63;
  --foto-sawah:none; /* opsional: isi url("...") bila ingin foto sungguhan di bawah ilustrasi */
}
html,body{margin:0;background:#0b3b2e}
body{min-height:100vh;min-height:100svh;overflow-x:hidden;color:var(--lg-ink)}

/* ---------- Latar sinematik ---------- */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0b3b2e;--px:0;--py:0;contain:strict}
.scene .photo{position:absolute;inset:0;background:var(--foto-sawah) center/cover no-repeat;opacity:.9}
.scene .ly{position:absolute;inset:-3%;will-change:transform;transform:translate3d(calc(var(--px)*var(--d,0px)*-1),calc(var(--py)*var(--e,0px)*-1),0)}
.scene .sv{display:block;width:100%;height:100%}
.ly.l1{--d:4px;--e:2px}.ly.l2{--d:8px;--e:3px}.ly.l3{--d:14px;--e:5px}.ly.l4{--d:26px;--e:9px}
.rays{position:absolute;inset:-30%;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:.55;
  background:conic-gradient(from 188deg at 73% 37%,transparent 0 7deg,rgba(255,226,150,.20) 9deg,transparent 15deg,rgba(255,226,150,.12) 19deg,transparent 25deg,rgba(255,226,150,.16) 31deg,transparent 38deg,rgba(255,226,150,.10) 44deg,transparent 52deg);
  transform-origin:73% 37%;animation:rays 26s ease-in-out infinite alternate}
.mist{position:absolute;left:-20%;right:-20%;z-index:3;pointer-events:none;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,246,224,.34),rgba(255,246,224,0) 68%);filter:none}
.mist.m1{top:41%;height:20%;animation:drift 46s ease-in-out infinite alternate}
.mist.m2{top:50%;height:16%;opacity:.7;animation:drift 62s ease-in-out -20s infinite alternate-reverse}
.ly.l4{z-index:5;pointer-events:none}.ly.l3{z-index:2}.ly.l2{z-index:1}
.grade{position:absolute;inset:0;z-index:6;pointer-events:none;
  background:
   linear-gradient(90deg,rgba(5,28,21,.78) 0%,rgba(5,28,21,.58) 45%,rgba(5,28,21,.26) 62%,rgba(5,28,21,0) 76%),
   linear-gradient(180deg,rgba(4,24,18,.55) 0%,rgba(4,24,18,0) 30%,rgba(4,24,18,0) 62%,rgba(4,24,18,.62) 100%),
   radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(2,16,12,.5) 100%)}
.motes{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.motes i{position:absolute;bottom:-12px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle,rgba(255,240,180,.95),rgba(255,226,140,0) 70%);opacity:0;animation:mote var(--t) linear var(--w) infinite}

/* gerak lingkungan sawah */
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5.2s ease-in-out infinite alternate}
.sway.sb{animation-duration:6.6s;animation-delay:-2s}.sway.sc{animation-duration:4.6s;transform-origin:20% 100%}.sway.sd{animation-duration:5.8s;animation-delay:-1.4s;transform-origin:80% 100%}
.walker{transform-origin:0 0;animation:walk 84s linear infinite}
.wk-bob{animation:bob .62s ease-in-out infinite alternate}
.leg,.arm{transform-box:fill-box;transform-origin:50% 0}
.leg.lf{animation:stepA 1.24s ease-in-out infinite alternate}.leg.lb{animation:stepB 1.24s ease-in-out infinite alternate}
.arm{transform-origin:20% 0;animation:swing 1.24s ease-in-out infinite alternate}
.far{opacity:.92}.bend{transform-box:fill-box;transform-origin:50% 100%;animation:stoop 7s ease-in-out infinite alternate}.far.f2 .bend{animation-delay:-3s;animation-duration:9s}
@keyframes sway{from{transform:rotate(-1.4deg) skewX(-.8deg)}to{transform:rotate(1.6deg) skewX(.9deg)}}
@keyframes walk{0%{transform:translate(657px,730px) scale(.605);opacity:0}5%{opacity:1}92%{opacity:1}100%{transform:translate(751px,565px) scale(.221);opacity:0}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes stepA{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes stepB{from{transform:rotate(20deg)}to{transform:rotate(-20deg)}}
@keyframes swing{from{transform:rotate(14deg)}to{transform:rotate(-10deg)}}
@keyframes stoop{from{transform:rotate(0)}to{transform:rotate(-6deg) translateY(1px)}}
@keyframes rays{from{transform:rotate(-3deg);opacity:.42}to{transform:rotate(3deg);opacity:.64}}
@keyframes drift{from{transform:translateX(-4%)}to{transform:translateX(6%)}}
@keyframes mote{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.8}85%{opacity:.5}100%{transform:translate3d(var(--dx),-78vh,0);opacity:0}}
.scene.paused *,.scene.paused{animation-play-state:paused!important}

/* ---------- Tata letak ---------- */
.login{position:relative;z-index:10;min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(380px,.88fr);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hero{display:flex;align-items:flex-start;padding:clamp(28px,6vh,72px) clamp(28px,5vw,84px);color:#d7efe4;background:none;overflow:visible}
.hero:after{display:none}
.brand{max-width:560px}
.hero .logo{width:auto;height:84px;min-width:84px;padding:8px;border-radius:22px;background:linear-gradient(145deg,#fff,#f6f1de);display:inline-flex;align-items:center;justify-content:center;position:relative;
  box-shadow:0 0 0 1px rgba(201,162,39,.7),0 0 0 5px rgba(255,255,255,.12),0 16px 36px rgba(0,0,0,.4),inset 0 1px 0 #fff;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.hero .logo:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(130deg,rgba(255,255,255,.7),rgba(255,255,255,0) 45%);pointer-events:none}
.hero .logo img{display:block;height:100%;width:auto;max-width:none;object-fit:contain}
.hero h1{margin:22px 0 8px;font-size:clamp(40px,5.2vw,68px);line-height:1;font-weight:800;letter-spacing:.04em;color:#fff;
  background:linear-gradient(180deg,#fff 30%,var(--lg-gold-soft));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;filter:drop-shadow(0 4px 18px rgba(0,0,0,.35));animation:rise .9s .12s cubic-bezier(.2,.8,.2,1) both}
.hero p.s{margin:0;font-size:clamp(15px,1.5vw,19px);font-weight:500;line-height:1.5;color:#d6efe2;max-width:460px;text-shadow:0 2px 12px rgba(0,0,0,.45);animation:rise .9s .24s cubic-bezier(.2,.8,.2,1) both}
.hero .bar{width:0;height:3px;border-radius:2px;margin:18px 0;background:linear-gradient(90deg,var(--lg-gold),var(--lg-gold-soft),transparent);animation:line 1.1s .5s ease forwards}
.hero p.s2{font-size:clamp(13px,1.15vw,15px);color:#bfe3d1;animation-delay:.38s}
.panel{display:flex;align-items:center;justify-content:center;padding:clamp(20px,4vh,48px) clamp(20px,4vw,64px)}
.panel .wrap{width:100%;max-width:420px}

/* ---------- Panel kaca ---------- */
.box{position:relative;width:100%;max-width:none;box-sizing:border-box;padding:clamp(22px,3.4vh,34px) clamp(20px,2.6vw,32px) clamp(22px,3.2vh,30px);border-radius:26px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,252,244,.9),rgba(250,245,231,.82));
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 34px 70px -22px rgba(2,22,15,.7),0 10px 24px -10px rgba(2,22,15,.4),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(201,162,39,.28);
  animation:panelIn .9s .15s cubic-bezier(.2,.8,.2,1) both}
.box:before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.14) 26%,rgba(255,255,255,0) 44%)}
.box:after{content:"";position:absolute;left:12%;right:12%;top:0;height:2px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(201,162,39,.95),transparent)}
.box>*{position:relative}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.box{background:linear-gradient(180deg,rgba(255,252,244,.97),rgba(250,245,231,.95))}}
.box h2{margin:0 0 4px;font-size:clamp(24px,2.6vw,30px);font-weight:800;color:var(--lg-forest);letter-spacing:.01em}
.box .sub{margin:0 0 14px;color:#3e5246;font-size:14px;line-height:1.45}
.box label{display:block;margin:12px 0 6px;font-size:12px;font-weight:700;letter-spacing:.05em;color:#35493d}
.field{position:relative}
.field svg{position:absolute;left:15px;top:50%;width:19px;height:19px;margin-top:-9.5px;stroke:#7b9186;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;transition:stroke .2s}
.field:focus-within svg{stroke:var(--lg-emerald)}
.field .toggle-password{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;padding:0;border:0;border-radius:10px;
  color:#71877b;background:transparent;cursor:pointer;
  transition:color .2s,background .2s;
}
.field .toggle-password:hover{color:var(--lg-emerald-d);background:rgba(5,150,105,.08)}
.field .toggle-password:focus-visible{outline:2px solid var(--lg-emerald);outline-offset:1px}
.field .toggle-password svg{
  position:static;width:19px;height:19px;margin:0;
  stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none;
}
.box input#p{padding-right:52px}
.box input{display:block;width:100%;box-sizing:border-box;height:50px;padding:0 14px 0 45px;font-size:16px;color:var(--lg-ink);background:rgba(255,255,255,.88);
  border:1.5px solid rgba(15,77,59,.2);border-radius:14px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s;box-shadow:inset 0 1px 2px rgba(15,77,59,.06)}
.box input:hover{border-color:rgba(5,150,105,.45)}
.box input:focus{background:#fff;border-color:var(--lg-emerald);box-shadow:0 0 0 4px rgba(5,150,105,.18),inset 0 1px 2px rgba(15,77,59,.04)}
.box input:-webkit-autofill{-webkit-box-shadow:0 0 0 50px #fff inset;-webkit-text-fill-color:var(--lg-ink)}
.box #b{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:52px;margin-top:18px;padding:0 16px;overflow:hidden;cursor:pointer;
  font-size:15.5px;font-weight:800;letter-spacing:.05em;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:14px;
  background:linear-gradient(135deg,#0b3b2e 0%,#0a6048 46%,#059669 100%);text-shadow:0 1px 2px rgba(0,0,0,.4);
  box-shadow:0 12px 26px -10px rgba(5,150,105,.85),0 2px 0 rgba(255,255,255,.12) inset,0 -12px 20px rgba(0,0,0,.18) inset;
  transition:transform .18s ease,box-shadow .25s ease,filter .25s ease}
.box #b:before{content:"";position:absolute;left:0;right:0;top:0;height:52%;border-radius:14px 14px 40% 40%/14px 14px 12px 12px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.02));pointer-events:none}
.box #b:after{content:"";position:absolute;top:-20%;bottom:-20%;left:-55%;width:38%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);pointer-events:none;transition:left .75s ease}
.box #b:hover{transform:translateY(-1px);filter:brightness(1.08) saturate(1.08);box-shadow:0 16px 30px -10px rgba(5,150,105,.95),0 2px 0 rgba(255,255,255,.16) inset,0 -12px 20px rgba(0,0,0,.16) inset;background:linear-gradient(135deg,#0b3b2e 0%,#0a6048 46%,#059669 100%)}
.box #b:hover:after{left:130%}
.box #b:active{transform:translateY(1px) scale(.992);filter:brightness(.97)}
.box #b:focus-visible{outline:3px solid var(--lg-gold);outline-offset:3px}
.box #b:disabled{cursor:progress;opacity:.92;filter:none;transform:none;
  background:repeating-linear-gradient(135deg,#0b6b4f 0 14px,#0a5c44 14px 28px);background-size:40px 40px;animation:stripes 1s linear infinite}
.box #b:disabled:after{display:none}
.box #msg{margin:12px 0 0;min-height:0;padding:9px 12px;font-size:13.5px;font-weight:600;line-height:1.4;color:#a52a1d;background:#fdecea;border:1px solid #f3b9b2;border-radius:10px}
.box #msg:empty{margin:0;padding:0;border-color:transparent;background:none}
#info .banner{margin:0 0 6px;padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;background:var(--lg-gold-soft);color:#5b4500;border:1px solid #e3c968;font-weight:600}
.notice{margin:14px auto 0;width:fit-content;max-width:100%;box-sizing:border-box;padding:7px 14px;text-align:center;font-size:12px;line-height:1.45;color:#e8f6ee;background:rgba(4,28,21,.62);border:1px solid rgba(255,255,255,.14);border-radius:14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes panelIn{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
@keyframes line{to{width:min(180px,40%)}}
@keyframes stripes{to{background-position:40px 0}}

/* ---------- Tata letak desktop: logo, judul, dan deskripsi ---------- */
@media(min-width:821px){
  .brand{
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    column-gap:18px;
    align-items:center;
    max-width:560px;
  }

  .hero .logo{
    grid-column:1;
    grid-row:1 / span 2;
  }

  .hero h1{
    grid-column:2;
    margin:0 0 8px;
    white-space:normal;
  }

  .hero h2{
    grid-column:2;
    margin:0;
    font-size:clamp(15px,1.5vw,19px);
    font-weight:500;
    line-height:1.5;
    color:#d6efe2;
    max-width:460px;
    text-shadow:0 2px 12px rgba(0,0,0,.45);
    animation:rise .9s .24s cubic-bezier(.2,.8,.2,1) both;
  }
}
/* ---------- Tablet ---------- */
@media(max-width:1024px) and (min-width:821px){.login{grid-template-columns:minmax(0,1fr) minmax(360px,.95fr)}.hero{padding:40px 28px}.hero .logo{height:72px}.hero h1{font-size:44px}}

/* ---------- Ponsel: satu kolom, panel login langsung terlihat ---------- */
@media(max-width:820px){
  .login{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-content:start}
  .hero{padding:16px 18px 6px}
  .brand{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;max-width:none}
  .hero .logo{grid-row:1 / span 3;height:52px;min-width:52px;padding:5px;border-radius:15px;animation-duration:.6s}
  .hero h1{margin:0;font-size:25px;letter-spacing:.05em}
  .hero p.s{
  grid-column:2;
  font-size:12.5px;
  line-height:1.35;
  max-width:none
}
  .hero .bar{display:none}
  .hero p.s2{font-size:11.5px;margin-top:3px;color:#c6e6d6}
  .panel{align-items:flex-start;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
  .panel .wrap{max-width:460px;margin:0 auto}
  .box{border-radius:22px;padding:20px 18px 20px}
  .box h2{font-size:24px}.box .sub{margin-bottom:6px;font-size:13.5px}
  .box label{margin:10px 0 5px}
  .box #b{margin-top:16px}
  .notice{margin-top:12px}
  .grade{background:linear-gradient(180deg,rgba(4,24,18,.72) 0%,rgba(4,24,18,.28) 22%,rgba(4,24,18,0) 48%,rgba(4,24,18,.5) 100%),radial-gradient(130% 90% at 50% 45%,transparent 55%,rgba(2,16,12,.45) 100%)}
  .motes i:nth-child(n+9){display:none}
  .rays{opacity:.4}
}
@media(max-width:380px){.hero h1{font-size:22px}.hero p.s2{display:none}.box{padding:18px 15px}}
@media(max-width:820px) and (max-height:600px){.hero p.s2{display:none}.box .sub{display:none}.box{padding-top:16px;padding-bottom:16px}.notice{display:none}}
/* ponsel mendatar: dua kolom ringkas agar form tidak terdorong */
@media(max-height:520px) and (orientation:landscape) and (max-width:1000px){
  .login{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);grid-template-rows:none;align-content:stretch}
  .hero{padding:14px 16px;align-items:center}.brand{display:block}.hero .logo{height:44px;min-width:44px}.hero h1{margin-top:10px;font-size:24px}.hero p.s2,.hero .bar{display:none}
  .panel{align-items:center;padding:10px 16px}.box .sub,.notice{display:none}
}

/* ---------- Aksesibilitas: kurangi gerak ---------- */
@media(prefers-reduced-motion:reduce){
  .scene *,.scene,.hero *,.box,.box *{animation:none!important;transition:none!important}
  .walker{transform:translate(702px,648px) scale(.41);opacity:1}
  .hero .bar{width:min(180px,40%)}.motes{display:none}
  .box #b:disabled{background:#0b6b4f}
}
@media(forced-colors:active){.box{border:1px solid CanvasText;background:Canvas}.box #b{border:1px solid ButtonText}}
</style>
</head>

<defs>
<linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a6d73"/><stop offset=".28" stop-color="#5aa08c"/><stop offset=".5" stop-color="#b4d38c"/><stop offset=".74" stop-color="#f6e09a"/><stop offset="1" stop-color="#ffedbd"/></linearGradient>
<radialGradient id="gSun" cx="1180" cy="330" r="340" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff6cf" stop-opacity="1"/><stop offset=".12" stop-color="#ffe9a6" stop-opacity=".8"/><stop offset=".4" stop-color="#ffd37a" stop-opacity=".28"/><stop offset="1" stop-color="#ffd37a" stop-opacity="0"/></radialGradient>

<rect width="1600" height="900" fill="url(#gSky)"/>

</svg>
  </div>
  <div class="rays"></div>
  <div class="ly l2">
<svg class="sv" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
<defs>
<linearGradient id="gH1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb4a0"/><stop offset="1" stop-color="#c3da9e"/></linearGradient>
<linearGradient id="gH2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c9168"/><stop offset="1" stop-color="#86b76a"/></linearGradient>
<linearGradient id="gHaze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9b4" stop-opacity="0"/><stop offset="1" stop-color="#ffe2a0" stop-opacity=".5"/></linearGradient>
</defs>

<div class="login">
  <section class="hero">
    <div class="brand">
      <div class="logo">
        <img src="assets/img/logoinhil.png" alt="Logo Kabupaten Indragiri Hilir" decoding="async">
      </div>
      <h1>SIMON-LTT</h1>
      <h2>Sistem Informasi Monitoring Luas Tambah Tanam</h2>
      <h2>Bidang Tanaman Pangan dan Hortikultura, Dinas Pertanian Kabupaten indragiri hilir
      </div>
  </section>
  <section class="panel">
    <div class="wrap">
      <form class="box" id="f" autocomplete="on">
        <h2>Masuk</h2><div class="sub">Gunakan akun yang diberikan oleh petugas kabupaten.</div>
        <div id="info"></div>
        <label for="u">Username</label>
        <div class="field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg><input id="u" name="username" autocomplete="username" autocapitalize="none" required></div>
        <label for="p">Password</label>
        <div class="field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 018 0v3"/></svg><input id="p" name="password" type="password" autocomplete="current-password" required><button class="toggle-password" id="togglePassword" type="button" aria-label="Tampilkan password" aria-pressed="false" title="Tampilkan password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <button class="btn" id="b" type="submit" style="width:100%;margin-top:16px;padding:12px">Masuk Sistem</button>
        <div id="msg" role="alert"></div>
      </form>
      <p class="notice">Akses terbatas untuk petugas dan pimpinan. Seluruh aktivitas tercatat.</p>
    </div>
  </section>
</div>
<script>
(function(){
  var U=SimonUI;
  if(SimonAPI.session()){location.replace(SIMON_CONFIG.HOME_PAGE);return;}
  if(new URLSearchParams(location.search).get('expired'))document.getElementById('info').innerHTML='<div class="banner warn">Sesi Anda berakhir. Silakan masuk kembali.</div>';
  var password=document.getElementById('p'),toggle=document.getElementById('togglePassword');
  toggle.addEventListener('click',function(){
    var visible=password.type==='password';
    password.type=visible?'text':'password';
    toggle.setAttribute('aria-pressed',String(visible));
    toggle.setAttribute('aria-label',visible?'Sembunyikan password':'Tampilkan password');
    toggle.title=visible?'Sembunyikan password':'Tampilkan password';
    toggle.innerHTML=visible
      ?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 002.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0112 5c6.4 0 10 7 10 7a16.5 16.5 0 01-3.1 3.8"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 004-.8"/></svg>'
      :'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  });
  document.getElementById('f').addEventListener('submit',async function(e){
    e.preventDefault();var m=document.getElementById('msg'),b=document.getElementById('b');m.textContent='';
    var u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
    if(!u||!p){m.textContent='Harap isi username dan password.';return;}
    U.busy(b,true,'Memproses…');
    try{var pr=await SimonAPI.login(u,p);location.replace(pr.mustChange?'pengaturan.html?ganti=1':SIMON_CONFIG.HOME_PAGE);}
    catch(er){m.textContent=er.code==='NETWORK'?er.message:(er.code==='AUTH_FAILED'?er.message:U.errMsg(er));U.busy(b,false);document.getElementById('p').value='';}
  });
})();
</script>
<script>
/* Dekoratif saja: tidak menyentuh formulir, token, atau autentikasi. Gagal pun tidak memengaruhi login. */
(function(){
  try{
    var sc=document.getElementById('scene');if(!sc)return;
    document.addEventListener('visibilitychange',function(){sc.classList.toggle('paused',document.hidden);});
    var mq=window.matchMedia;
    if(!mq||mq('(prefers-reduced-motion: reduce)').matches||!mq('(hover: hover) and (pointer: fine)').matches)return;
    var raf=0,tx=0,ty=0;
    window.addEventListener('pointermove',function(e){
      tx=(e.clientX/window.innerWidth-.5)*2;ty=(e.clientY/window.innerHeight-.5)*2;
      if(!raf)raf=requestAnimationFrame(function(){raf=0;sc.style.setProperty('--px',tx.toFixed(3));sc.style.setProperty('--py',ty.toFixed(3));});
    },{passive:true});
  }catch(_){}
})();
</script>
